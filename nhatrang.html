<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Nha Trang - Amigos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: linear-gradient(160deg, #0a0f1e 0%, #16213e 50%, #1a1f3e 100%);
  color: #e2e8f0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container { text-align: center; padding: 30px; max-width: 480px; }

h1 {
  font-size: 2.2rem;
  font-weight: 800;
  background: linear-gradient(135deg, #f97316, #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}
.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }

.photo-frame {
  border-radius: 20px;
  overflow: hidden;
  border: 3px solid transparent;
  background: linear-gradient(135deg, #f97316, #ec4899) border-box;
  -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  margin-bottom: 25px;
  box-shadow: 0 10px 50px rgba(236,72,153,0.2);
}
.photo-frame img { width: 100%; display: block; }

/* Big Heart */
.big-heart {
  font-size: 8rem;
  line-height: 1;
  margin: 15px 0;
  display: none;
}
.big-heart.beating {
  display: block;
  animation: heartbeat 0.8s ease-in-out infinite;
}
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  14% { transform: scale(1.3); }
  28% { transform: scale(1); }
  42% { transform: scale(1.3); }
  70% { transform: scale(1); }
}

.heart-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(135deg, #ec4899, #f97316);
  color: white;
  border: none;
  padding: 16px 38px;
  border-radius: 60px;
  font-size: 1.2rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 8px 32px rgba(236,72,153,0.3);
  transition: all 0.3s ease;
}
.heart-btn:hover { transform: scale(1.05); box-shadow: 0 12px 48px rgba(236,72,153,0.5); }
.heart-btn:active { transform: scale(0.95); }
.heart-btn .icon { font-size: 1.6rem; }

.robot-links { margin-top: 15px; }
.robot-btn {
  display: inline-block;
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  color: white;
  text-decoration: none;
  padding: 12px 28px;
  border-radius: 60px;
  font-size: 1rem;
  font-weight: 700;
  font-family: inherit;
  box-shadow: 0 8px 32px rgba(124,58,237,0.3);
  transition: all 0.3s ease;
}
.robot-btn:hover { transform: scale(1.05); box-shadow: 0 12px 48px rgba(124,58,237,0.5); }
.robot-btn:active { transform: scale(0.95); }

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(0); }
  50% { opacity: 1; transform: translateY(-200px) scale(1.2); }
  100% { opacity: 0; transform: translateY(-400px) scale(0.5); }
}
</style>
</head>
<body>
<div class="container">
  <h1>💖 Nha Trang</h1>
  <div class="sub">Els amics, sempre al cor 🧡</div>

  <div class="photo-frame">
    <img src="nhatrang.jpg" alt="Amigos de Nha Trang">
  </div>

  <div class="big-heart" id="bigHeart">💖</div>

  <button class="heart-btn" onclick="showHeart()">
    <span class="icon">💗</span>
    Amistat!
  </button>

  <div class="robot-links">
    <a class="robot-btn" href="https://duskoi.github.io/vicdomotic/#robots">
      🤖 Alquiler de Robots Humanoides
    </a>
  </div>
</div>

<script>
function showHeart() {
  const heart = document.getElementById('bigHeart');
  heart.style.display = 'block';
  heart.classList.remove('beating');
  void heart.offsetWidth;
  heart.classList.add('beating');

  // Floating hearts
  for (let i = 0; i < 10; i++) {
    setTimeout(() => {
      const float = document.createElement('div');
      float.textContent = '💖';
      float.style.cssText = `
        position: fixed;
        font-size: ${1.5 + Math.random() * 2}rem;
        pointer-events: none;
        z-index: 999;
        left: ${20 + Math.random() * 60}%;
        bottom: 20%;
        animation: floatUp ${2 + Math.random() * 2}s ease-out forwards;
      `;
      document.body.appendChild(float);
      setTimeout(() => float.remove(), 4000);
    }, i * 150);
  }
}
</script>
</body>
</html>
