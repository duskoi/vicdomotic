<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b4a63"/>
      <stop offset="100%" stop-color="#2d3a4d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>

  <!-- Sensor body -->
  <rect x="100" y="60" width="200" height="140" rx="12" fill="url(#body)" stroke="#f97316" stroke-width="3"/>

  <!-- Grill / sensing element -->
  <rect x="125" y="85" width="70" height="90" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <line x1="135" y1="95" x2="135" y2="165" stroke="#f97316" stroke-width="2"/>
  <line x1="145" y1="95" x2="145" y2="165" stroke="#f97316" stroke-width="2"/>
  <line x1="155" y1="95" x2="155" y2="165" stroke="#f97316" stroke-width="2"/>
  <line x1="165" y1="95" x2="165" y2="165" stroke="#f97316" stroke-width="2"/>
  <line x1="175" y1="95" x2="175" y2="165" stroke="#f97316" stroke-width="2"/>
  <line x1="185" y1="95" x2="185" y2="165" stroke="#f97316" stroke-width="2"/>

  <!-- Label -->
  <text x="215" y="110" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="bold">DHT11</text>
  <text x="215" y="135" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Temp + Humitat</text>

  <!-- Status LED -->
  <circle cx="260" cy="170" r="8" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="240" y="185" fill="#64748b" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">ACTIU</text>

  <!-- Pins -->
  <line x1="130" y1="200" x2="130" y2="225" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="200" x2="200" y2="225" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <line x1="270" y1="200" x2="270" y2="225" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

  <text x="130" y="242" fill="#f97316" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">VCC</text>
  <text x="200" y="242" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">DATA</text>
  <text x="270" y="242" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">GND</text>
</svg>
