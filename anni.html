<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👋 Hello Anni!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: linear-gradient(160deg, #0a0f1e 0%, #1a1233 50%, #2a1240 100%);
  color: #e2e8f0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.container { text-align: center; padding: 30px; max-width: 500px; }

h1 {
  font-size: 4.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, #ec4899, #a855f7, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
  animation: glow 3s ease-in-out infinite;
}
@keyframes glow {
  0%,100% { filter: drop-shadow(0 0 10px rgba(168,85,247,0.3)); }
  50% { filter: drop-shadow(0 0 25px rgba(168,85,247,0.6)); }
}
.sub { color: #94a3b8; font-size: 1rem; margin-bottom: 35px; }

/* Clickable icon */
.icon-btn {
  font-size: 7rem;
  line-height: 1;
  background: none;
  border: none;
  cursor: pointer;
  display: inline-block;
  transition: transform 0.2s ease;
  filter: drop-shadow(0 0 20px rgba(168,85,247,0.4));
  animation: float 2.5s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}
.icon-btn:hover { transform: scale(1.15); }
.icon-btn:active { transform: scale(0.9); }

/* Message */
#message {
  margin-top: 30px;
  font-size: 3.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, #ec4899, #a855f7, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  opacity: 0;
  transform: scale(0.3);
  transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
#message.show {
  opacity: 1;
  transform: scale(1);
}

/* Sparkles */
.sparkle {
  position: fixed;
  font-size: 1.8rem;
  z-index: 999;
  pointer-events: none;
  opacity: 0;
  animation: sparkleUp 2.5s ease-out forwards;
}
@keyframes sparkleUp {
  0% { opacity: 0; transform: translateY(0) scale(0) rotate(0deg); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-250px) scale(1.3) rotate(180deg); }
}
</style>
</head>
<body>
<div class="container">
  <h1>Anni 💜</h1>
  <div class="sub">Press the icon! 👇</div>

  <button class="icon-btn" onclick="sayHello()">🌸</button>

  <div id="message">👋 Hello Anni!</div>
</div>

<script>
function sayHello() {
  const msg = document.getElementById('message');
  msg.style.display = 'block';
  msg.classList.remove('show');
  void msg.offsetWidth;
  msg.classList.add('show');

  // Sparkles
  const icons = ['🌸','✨','💜','🌟','💖','🦋'];
  for (let i = 0; i < 12; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'sparkle';
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = (5 + Math.random() * 90) + '%';
      el.style.top = (50 + Math.random() * 30) + '%';
      el.style.fontSize = (1.2 + Math.random() * 1.8) + 'rem';
      el.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 130);
  }
}
</script>
</body>
</html>
