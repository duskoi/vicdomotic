<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍣 Kim — Tôi thích sushi!</title>

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="🍣 Kim — Tôi thích sushi!">
<meta property="og:description" content="Một bất ngờ cho Kim 🍣💖">
<meta property="og:image" content="https://duskoi.github.io/vicdomotic/kim.jpg">
<meta property="og:url" content="https://duskoi.github.io/vicdomotic/kim.html">
<meta name="twitter:card" content="summary_large_image">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: linear-gradient(160deg, #0a0f1e 0%, #1e1020 50%, #301028 100%);
  color: #e2e8f0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.container { text-align: center; padding: 30px; max-width: 480px; }

h1 {
  font-size: 4.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, #ec4899, #f43f5e, #f97316);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
  animation: glow 3s ease-in-out infinite;
}
@keyframes glow {
  0%,100% { filter: drop-shadow(0 0 10px rgba(236,72,153,0.3)); }
  50% { filter: drop-shadow(0 0 25px rgba(236,72,153,0.6)); }
}
.sub { color: #94a3b8; font-size: 1rem; margin-bottom: 35px; }

/* Button */
.btn-kim {
  background: linear-gradient(135deg, #ec4899, #f43f5e);
  color: white;
  border: none;
  padding: 20px 60px;
  border-radius: 60px;
  font-size: 2rem;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 1px;
  box-shadow: 0 8px 32px rgba(236,72,153,0.4);
  transition: all 0.3s ease;
}
.btn-kim:hover { transform: scale(1.08); box-shadow: 0 12px 48px rgba(236,72,153,0.6); }
.btn-kim:active { transform: scale(0.95); }

/* Photo reveal */
.photo-reveal {
  margin: 25px auto 0;
  max-width: 320px;
  border-radius: 20px;
  overflow: hidden;
  border: 3px solid #ec4899;
  box-shadow: 0 10px 50px rgba(236,72,153,0.3);
  max-height: 0;
  opacity: 0;
  transform: scale(0.7);
  transition: all 0.9s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
.photo-reveal.show {
  max-height: 500px;
  opacity: 1;
  transform: scale(1);
}
.photo-reveal img { width: 100%; display: block; }

/* Message */
#message {
  margin-top: 30px;
  font-size: 2.8rem;
  font-weight: 800;
  background: linear-gradient(135deg, #ec4899, #f43f5e, #f97316);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.4;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.6s ease 0.3s;
}
#message.show {
  opacity: 1;
  transform: translateY(0);
}
#message .vn { display: block; }
#message .es { display: block; font-size: 1rem; color: #94a3b8; margin-top: 8px; -webkit-text-fill-color: #94a3b8; }

/* Floating hearts */
.heart-float {
  position: fixed;
  font-size: 2.2rem;
  z-index: 999;
  pointer-events: none;
  opacity: 0;
  animation: heartUp 3s ease-out forwards;
}
@keyframes heartUp {
  0% { opacity: 0; transform: translateY(0) scale(0) rotate(0deg); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-350px) scale(1.4) rotate(25deg); }
}
</style>
</head>
<body>
<div class="container">
  <h1>Kim 💖</h1>
  <div class="sub">Nhấn nút! 👇</div>

  <button class="btn-kim" onclick="surprise()">KIM!</button>

  <div class="photo-reveal" id="photoReveal">
    <img src="kim.jpg" alt="Kim">
  </div>

  <div id="message">
    <span class="vn">Tôi thích sushi! 🍣</span>
    <span class="es">¡Me gusta el sushi!</span>
  </div>
</div>

<script>
function surprise() {
  document.getElementById('photoReveal').classList.add('show');
  const msg = document.getElementById('message');
  msg.classList.add('show');

  // Many hearts
  const hearts = ['💖','💗','💕','💝','❤️','💜','🩷','🍣','💘'];
  for (let i = 0; i < 24; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'heart-float';
      el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      el.style.left = (3 + Math.random() * 94) + '%';
      el.style.top = (40 + Math.random() * 45) + '%';
      el.style.fontSize = (1.5 + Math.random() * 2.5) + 'rem';
      el.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4500);
    }, i * 100);
  }
}
</script>
</body>
</html>
