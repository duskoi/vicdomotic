<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 El Reencuentro de los Canatences</title>

<meta property="og:type" content="website">
<meta property="og:title" content="💖 El Reencuentro de los Canatences">
<meta property="og:description" content="Un reencuentro lleno de corazón 💖">
<meta property="og:image" content="https://duskoi.github.io/vicdomotic/canatences.jpg">
<meta property="og:url" content="https://duskoi.github.io/vicdomotic/canatences.html">
<meta name="twitter:card" content="summary_large_image">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: linear-gradient(160deg, #0a0f1e 0%, #2a1033 50%, #401040 100%);
  color: #e2e8f0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-y: auto;
}
.container { text-align: center; padding: 20px; max-width: 480px; }

h1 {
  font-size: 2.4rem;
  font-weight: 800;
  background: linear-gradient(135deg, #ec4899, #f43f5e, #a855f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
  animation: glow 3s ease-in-out infinite;
}
@keyframes glow {
  0%,100% { filter: drop-shadow(0 0 10px rgba(236,72,153,0.3)); }
  50% { filter: drop-shadow(0 0 25px rgba(236,72,153,0.6)); }
}
.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 22px; }

/* Icono pulsable */
.icon-btn {
  font-size: 6.5rem;
  line-height: 1;
  background: none;
  border: none;
  cursor: pointer;
  display: inline-block;
  transition: transform 0.2s ease;
  filter: drop-shadow(0 0 20px rgba(236,72,153,0.5));
  animation: float 2.5s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}
.icon-btn:hover { transform: scale(1.15); }
.icon-btn:active { transform: scale(0.9); }

/* Foto */
.photo-reveal {
  margin: 20px auto 0;
  max-width: 280px;
  border-radius: 20px;
  overflow: hidden;
  border: 3px solid #ec4899;
  box-shadow: 0 10px 50px rgba(236,72,153,0.3);
  max-height: 0;
  opacity: 0;
  transform: scale(0.7);
  transition: all 0.9s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
.photo-reveal.show {
  max-height: 600px;
  opacity: 1;
  transform: scale(1);
}
.photo-reveal img { width: 100%; display: block; }

/* Mensaje */
#message {
  margin-top: 16px;
  font-size: 1.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, #ec4899, #f43f5e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.7s ease 0.3s;
}
#message.show { opacity: 1; transform: translateY(0); }

/* Corazones */
.heart-float {
  position: fixed;
  font-size: 2rem;
  z-index: 999;
  pointer-events: none;
  opacity: 0;
  animation: heartUp 3s ease-out forwards;
}
@keyframes heartUp {
  0% { opacity: 0; transform: translateY(0) scale(0) rotate(0deg); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-350px) scale(1.4) rotate(25deg); }
}
</style>
</head>
<body>
<div class="container">
  <h1>💖 El Reencuentro de los Canatences</h1>
  <div class="sub">Pulsa el icono 👇</div>

  <button class="icon-btn" onclick="reencuentro()">💖</button>

  <div class="photo-reveal" id="photoReveal">
    <img src="canatences.jpg" alt="Reencuentro">
  </div>

  <div id="message">💖 ¡Reencuentro! 💖</div>
</div>

<script>
function reencuentro() {
  document.getElementById('photoReveal').classList.add('show');
  const msg = document.getElementById('message');
  msg.classList.add('show');

  // Muchos corazones
  const hearts = ['💖','💗','💕','💝','❤️','💜','💘','💞'];
  for (let i = 0; i < 28; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'heart-float';
      el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      el.style.left = (3 + Math.random() * 94) + '%';
      el.style.top = (40 + Math.random() * 45) + '%';
      el.style.fontSize = (1.5 + Math.random() * 2.5) + 'rem';
      el.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4500);
    }, i * 90);
  }
}
</script>
</body>
</html>
