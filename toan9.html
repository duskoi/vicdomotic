<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 Thi Toán 9 - Luyện Tập</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: linear-gradient(160deg, #0a0f1e 0%, #0f1e2e 50%, #0f2e2a 100%);
  color: #e2e8f0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container { text-align: center; padding: 30px; max-width: 560px; width: 100%; }

h1 {
  font-size: 2.8rem;
  font-weight: 800;
  background: linear-gradient(135deg, #38bdf8, #22c55e, #eab308);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}
.sub { color: #94a3b8; font-size: 1rem; margin-bottom: 25px; }

/* Start screen */
#startScreen .btn-start {
  background: linear-gradient(135deg, #38bdf8, #22c55e);
  color: #0a0f1e;
  border: none;
  padding: 20px 50px;
  border-radius: 60px;
  font-size: 1.5rem;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 8px 32px rgba(56,189,248,0.3);
  transition: all 0.3s ease;
  margin-top: 20px;
}
.btn-start:hover { transform: scale(1.05); }
.btn-start:active { transform: scale(0.95); }

/* Quiz screen */
#quizScreen { display: none; }
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  font-size: 1rem;
  color: #94a3b8;
}
.topbar .score { color: #22c55e; font-weight: 700; font-size: 1.2rem; }
.topbar .qnum { color: #38bdf8; font-weight: 700; }

.question-box {
  background: linear-gradient(145deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9));
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 24px;
  padding: 35px;
  margin-bottom: 20px;
}
.question-text {
  font-size: 1.8rem;
  font-weight: 700;
  margin-bottom: 10px;
  color: #e2e8f0;
}
.question-sub { font-size: 0.9rem; color: #64748b; margin-bottom: 15px; }

.options { display: grid; gap: 12px; }
.option {
  background: rgba(30,41,59,0.6);
  border: 2px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 16px 20px;
  font-size: 1.2rem;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  color: #e2e8f0;
  font-family: inherit;
  transition: all 0.2s;
}
.option:hover { border-color: #38bdf8; background: rgba(56,189,248,0.1); }
.option.correct { border-color: #22c55e; background: rgba(34,197,94,0.15); color: #22c55e; }
.option.wrong { border-color: #ef4444; background: rgba(239,68,68,0.15); color: #ef4444; }
.option:disabled { cursor: not-allowed; }

.feedback { margin-top: 15px; font-size: 1.1rem; font-weight: 600; min-height: 28px; }
.feedback.good { color: #22c55e; }
.feedback.bad { color: #ef4444; }

.next-btn {
  margin-top: 15px;
  background: linear-gradient(135deg, #38bdf8, #22c55e);
  color: #0a0f1e;
  border: none;
  padding: 14px 40px;
  border-radius: 50px;
  font-size: 1.1rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  display: none;
}
.next-btn:hover { transform: scale(1.03); }

/* Result screen */
#resultScreen { display: none; }
.result-box {
  background: linear-gradient(145deg, rgba(30,41,59,0.8), rgba(15,23,42,0.9));
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 24px;
  padding: 40px;
  margin-bottom: 20px;
}
.result-box .big-score { font-size: 4.5rem; font-weight: 800; color: #22c55e; }
.result-box .big-score.fail { color: #ef4444; }
.result-box .label { color: #94a3b8; font-size: 1rem; margin-top: 5px; }
.result-box .emoji { font-size: 3rem; margin-bottom: 10px; }
.result-msg { font-size: 1.2rem; color: #cbd5e1; margin-top: 15px; }
</style>
</head>
<body>
<div class="container">
  <!-- Start -->
  <div id="startScreen">
    <h1>📐 Thi Toán 9</h1>
    <div class="sub">Luyện tập toán lớp 9 · 10 câu hỏi</div>
    <button class="btn-start" onclick="startQuiz()">🚀 BẮT ĐẦU</button>
  </div>

  <!-- Quiz -->
  <div id="quizScreen">
    <div class="topbar">
      <span class="qnum" id="qnum">Câu 1/10</span>
      <span class="score" id="score">0 điểm</span>
    </div>
    <div class="question-box">
      <div class="question-text" id="question"></div>
      <div class="question-sub" id="questionSub"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Tiếp theo →</button>
    </div>
  </div>

  <!-- Result -->
  <div id="resultScreen">
    <div class="result-box">
      <div class="emoji" id="resultEmoji">🎉</div>
      <div class="big-score" id="finalScore">0/10</div>
      <div class="label">Kết quả của bạn</div>
      <div class="result-msg" id="resultMsg"></div>
    </div>
    <button class="btn-start" onclick="location.reload()">🔄 Làm lại</button>
  </div>
</div>

<script>
const QUESTIONS = [
  { q: "√49 = ?", sub: "Căn bậc hai", opts: ["6", "7", "8", "9"], correct: 1 },
  { q: "Giải: x² − 5x + 6 = 0", sub: "Phương trình bậc hai", opts: ["x = 2; x = 3", "x = 1; x = 6", "x = −2; x = −3", "x = 0; x = 5"], correct: 0 },
  { q: "√(a²·b²) = ? (a,b > 0)", sub: "Căn thức", opts: ["a·b", "a²·b²", "a + b", "a/b"], correct: 0 },
  { q: "Hàm số y = 2x + 3. Giá trị tại x = 4?", sub: "Hàm số bậc nhất", opts: ["8", "9", "11", "14"], correct: 2 },
  { q: "Tam giác vuông có cạnh 3 và 4. Cạnh huyền?", sub: "Định lý Pythagoras", opts: ["5", "6", "7", "12"], correct: 0 },
  { q: "√50 rút gọn = ?", sub: "Rút gọn căn thức", opts: ["5√2", "2√5", "10√5", "25√2"], correct: 0 },
  { q: "Giải hệ: x + y = 10; x − y = 4", sub: "Hệ phương trình", opts: ["x=7, y=3", "x=6, y=4", "x=8, y=2", "x=5, y=5"], correct: 0 },
  { q: "Đường kính = 10. Bán kính?", sub: "Đường tròn", opts: ["5", "10", "20", "2.5"], correct: 0 },
  { q: "y = x². Đồ thị có dạng?", sub: "Hàm số bậc hai", opts: ["Parabol", "Đường thẳng", "Elip", "Hyperbol"], correct: 0 },
  { q: "(a+b)² = ?", sub: "Hằng đẳng thức", opts: ["a² + 2ab + b²", "a² + b²", "a² − 2ab + b²", "2a + 2b"], correct: 0 }
];

let current = 0;
let score = 0;

function startQuiz() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  loadQuestion();
}

function loadQuestion() {
  const data = QUESTIONS[current];
  document.getElementById('qnum').textContent = 'Câu ' + (current+1) + '/10';
  document.getElementById('score').textContent = score + ' điểm';
  document.getElementById('question').textContent = data.q;
  document.getElementById('questionSub').textContent = data.sub;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  data.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = String.fromCharCode(65+i) + '. ' + opt;
    btn.onclick = () => answer(i, btn);
    opts.appendChild(btn);
  });
}

function answer(i, btn) {
  const data = QUESTIONS[current];
  const buttons = document.querySelectorAll('.option');
  buttons.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback');
  if (i === data.correct) {
    btn.classList.add('correct');
    score++;
    fb.textContent = '✅ Chính xác!';
    fb.className = 'feedback good';
  } else {
    btn.classList.add('wrong');
    buttons[data.correct].classList.add('correct');
    fb.textContent = '❌ Sai! Đáp án: ' + String.fromCharCode(65+data.correct);
    fb.className = 'feedback bad';
  }
  document.getElementById('score').textContent = score + ' điểm';

  if (current < QUESTIONS.length - 1) {
    document.getElementById('nextBtn').style.display = 'inline-block';
  } else {
    const btnNext = document.getElementById('nextBtn');
    btnNext.textContent = 'Xem kết quả 🏁';
    btnNext.style.display = 'inline-block';
  }
}

function nextQuestion() {
  if (current < QUESTIONS.length - 1) {
    current++;
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  document.getElementById('finalScore').textContent = score + '/10';

  const emoji = document.getElementById('resultEmoji');
  const msg = document.getElementById('resultMsg');
  const scoreEl = document.getElementById('finalScore');

  if (score === 10) { emoji.textContent = '🏆'; msg.textContent = 'Hoàn hảo! Bạn là thiên tài toán học!'; }
  else if (score >= 8) { emoji.textContent = '🌟'; msg.textContent = 'Rất giỏi! Cố lên nào!'; }
  else if (score >= 6) { emoji.textContent = '😊'; msg.textContent = 'Khá tốt! Luyện thêm nhé!'; }
  else if (score >= 4) { emoji.textContent = '📚'; msg.textContent = 'Cần ôn tập thêm. Cố gắng!'; }
  else { emoji.textContent = '💪'; msg.textContent = 'Đừng bỏ cuộc! Hãy thử lại!'; scoreEl.classList.add('fail'); }
}
</script>
</body>
</html>
